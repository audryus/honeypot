name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest first: the handler runs on whatever python3 the server ships
        # (Ubuntu 20.04: 3.8, Debian 11: 3.9, Debian 12: 3.11, Ubuntu 24.04: 3.12)
        include:
          - { python: "3.8", os: ubuntu-22.04 }
          - { python: "3.9", os: ubuntu-latest }
          - { python: "3.11", os: ubuntu-latest }
          - { python: "3.12", os: ubuntu-latest }
          - { python: "3.13", os: ubuntu-latest }
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile honeypot-handler.py render-bait.py
      - name: Unit tests
        # Safe on any machine: every command, kill and network call is faked
        run: python -m unittest discover -s tests -v
