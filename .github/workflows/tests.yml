name: tests

# Stage 1 (fast, in parallel): unit tests and lint, no root, nothing installed.
# Stage 2 (heavier, only if every stage 1 job passes): the real install,
# triggers and uninstall as root on a throwaway runner.

# Stage 3, the same test inside other distributions' VMs, is in vm.yml (monthly,
# heavy); it calls this workflow first, so it also only runs after 1 and 2 pass.

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The handler runs on whatever python3 the server ships
        # (Ubuntu 20.04: 3.8, Debian 11: 3.9, Debian 12: 3.11, Ubuntu 24.04: 3.12)
        include:
          - { python: "3.8", os: ubuntu-22.04 }
          - { python: "3.9", os: ubuntu-22.04 }
          - { python: "3.11", os: ubuntu-24.04 }
          - { python: "3.12", os: ubuntu-24.04 }
          - { python: "3.13", os: ubuntu-24.04 }
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile honeypot-handler.py render-bait.py
      - name: Unit tests
        # Safe on any machine: every command, kill and network call is faked
        run: python -m unittest discover -s tests -v

  shell-lint:
    name: shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n install.sh uninstall.sh common.sh
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
          shellcheck --version | head -2
          shellcheck -x -S warning install.sh uninstall.sh common.sh

  shell-unit:
    name: shell unit (bats)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Unit tests
        # No root: temp dirs and fake system tools only
        run: bats --print-output-on-failure tests/shell

  integration:
    name: integration (${{ matrix.os }})
    needs: [python, shell-lint, shell-unit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install, trigger, contain, ban, health, re-install, uninstall
        # Root on a disposable VM: installs auditd/sshd, kills sessions, edits nftables
        run: sudo GITHUB_ACTIONS=true tests/integration/run.sh
