name: vm

# Stage 3: the integration test inside VMs of other distributions (their
# official cloud images under QEMU/KVM), after stages 1 and 2 (tests.yml) pass.
# Heavy, so not on every push: monthly on the first Saturday at 08:00 GMT-3
# (11:00 UTC), and by hand (Actions > vm > Run workflow).

on:
  schedule:
    # cron can't say "first Saturday" (day-of-month and day-of-week are ORed):
    # this fires every Saturday and the gate job skips all but the first one.
    - cron: "0 11 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.day.outputs.run }}
    steps:
      - id: day
        run: |
          if [ "${{ github.event_name }}" != schedule ] || (( 10#$(date -u +%d) <= 7 )); then
            echo run=true >>"$GITHUB_OUTPUT"
          else
            echo "not the first Saturday of the month: skipping"
            echo run=false >>"$GITHUB_OUTPUT"
          fi

  tests:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/tests.yml

  vm:
    name: vm (${{ matrix.distro }})
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-12, debian-13, rocky-9, rocky-10, fedora, arch]
    steps:
      - uses: actions/checkout@v4
      - name: QEMU and KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Integration test in a ${{ matrix.distro }} VM
        run: tests/vm/run.sh ${{ matrix.distro }}
